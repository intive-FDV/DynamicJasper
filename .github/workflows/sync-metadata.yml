name: Sync project metadata

on:
  push:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - 'docs/_data/jr_compatibility.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Sync docs/_data/project.yml and README.md
        run: python3 scripts/sync_project_metadata.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/_data/project.yml README.md; then
            echo "No changes to sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/_data/project.yml README.md
          git commit -m "docs: sync project version and JR compatibility table [skip ci]"
          git push
